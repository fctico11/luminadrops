<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2a24"/>
      <stop offset="100%" stop-color="#0e1512"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39514a"/>
      <stop offset="50%" stop-color="#54756a"/>
      <stop offset="100%" stop-color="#2d423c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e4a1f"/>
      <stop offset="50%" stop-color="#9c6c2e"/>
      <stop offset="100%" stop-color="#5c3d18"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2740"/>
      <stop offset="50%" stop-color="#5c3b60"/>
      <stop offset="100%" stop-color="#301e33"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>

  <!-- shelves -->
  <g fill="#0a0f0c">
    <rect x="60" y="360" width="680" height="18"/>
    <rect x="60" y="680" width="680" height="18"/>
  </g>
  <g fill="#243027" opacity="0.6">
    <rect x="60" y="354" width="680" height="6"/>
    <rect x="60" y="674" width="680" height="6"/>
  </g>

  <!-- top shelf: bottles -->
  <g>
    <!-- tall bottle -->
    <path d="M150 360 L150 250 Q150 236 164 236 L186 236 Q200 236 200 250 L200 360 Z" fill="url(#glass)"/>
    <rect x="164" y="200" width="22" height="40" rx="4" fill="#22332d"/>
    <rect x="160" y="192" width="30" height="14" rx="4" fill="#101815"/>
    <rect x="158" y="284" width="34" height="44" rx="3" fill="#e9dfc4" opacity="0.9"/>
    <!-- round flask -->
    <circle cx="300" cy="316" r="46" fill="url(#amber)"/>
    <rect x="288" y="234" width="24" height="46" fill="url(#amber)"/>
    <rect x="284" y="226" width="32" height="12" rx="4" fill="#101010"/>
    <rect x="282" y="302" width="36" height="30" rx="3" fill="#e9dfc4" opacity="0.9"/>
    <!-- small jars -->
    <rect x="400" y="290" width="58" height="70" rx="8" fill="url(#plum)"/>
    <rect x="406" y="278" width="46" height="16" rx="5" fill="#171019"/>
    <rect x="410" y="310" width="38" height="28" rx="3" fill="#e9dfc4" opacity="0.9"/>
    <rect x="510" y="270" width="70" height="90" rx="10" fill="url(#glass)"/>
    <rect x="520" y="256" width="50" height="18" rx="6" fill="#141d1a"/>
    <rect x="522" y="296" width="46" height="34" rx="3" fill="#e9dfc4" opacity="0.9"/>
    <!-- tiny vial -->
    <rect x="640" y="300" width="30" height="60" rx="6" fill="url(#amber)"/>
    <rect x="646" y="288" width="18" height="14" rx="4" fill="#101010"/>
  </g>

  <!-- hanging herb bundles between shelves -->
  <g stroke="#0c110e" stroke-width="4" fill="none">
    <path d="M180 378 L180 430"/>
    <path d="M400 378 L400 418"/>
    <path d="M620 378 L620 436"/>
  </g>
  <g fill="#15201a">
    <path d="M180 430 q -26 50 -14 96 q 14 -8 20 -22 q 6 16 18 22 q 10 -50 -24 -96 z"/>
    <path d="M400 418 q -22 44 -12 84 q 12 -7 17 -19 q 5 14 16 19 q 9 -44 -21 -84 z"/>
    <path d="M620 436 q -26 48 -14 92 q 14 -8 20 -21 q 6 15 18 21 q 10 -48 -24 -92 z"/>
  </g>

  <!-- bottom shelf: mortar, book stack, tea tin -->
  <g>
    <!-- book stack -->
    <rect x="120" y="642" width="150" height="16" rx="3" fill="#3c2b28"/>
    <rect x="132" y="624" width="130" height="18" rx="3" fill="#22302b"/>
    <rect x="126" y="606" width="140" height="18" rx="3" fill="#4a3421"/>
    <!-- mortar & pestle -->
    <path d="M380 620 Q 380 668 430 668 Q 480 668 480 620 L 470 604 L 390 604 Z" fill="#2a2622"/>
    <ellipse cx="430" cy="604" rx="40" ry="10" fill="#3b352f"/>
    <rect x="452" y="548" width="14" height="52" rx="7" transform="rotate(28 459 574)" fill="#3b352f"/>
    <!-- tea tin -->
    <rect x="560" y="586" width="86" height="82" rx="8" fill="url(#plum)"/>
    <rect x="560" y="578" width="86" height="14" rx="6" fill="#1c131e"/>
    <rect x="572" y="608" width="62" height="40" rx="3" fill="#e9dfc4" opacity="0.9"/>
    <!-- crescent moon stamp on the label -->
    <path d="M612 620 a 12 12 0 1 0 0 16 a 9 9 0 1 1 0 -16 z" fill="#5c3b60"/>
  </g>

  <!-- floor shadow -->
  <rect x="0" y="760" width="800" height="240" fill="#070b09"/>
  <g fill="#e9dfc4" opacity="0.08">
    <circle cx="140" cy="120" r="2"/>
    <circle cx="660" cy="90" r="2"/>
    <circle cx="420" cy="70" r="1.6"/>
  </g>
</svg>
