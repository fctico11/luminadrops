<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="room" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#241e19"/>
      <stop offset="55%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#332619"/>
      <stop offset="100%" stop-color="#1a130e"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8172"/>
      <stop offset="100%" stop-color="#c9bfa0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#room)"/>

  <!-- journal, resting closed -->
  <g>
    <rect x="548" y="288" width="14" height="424" rx="4" fill="url(#pages)"/>
    <rect x="238" y="286" width="320" height="428" rx="14" fill="url(#cover)" stroke="#4c4740" stroke-width="2"/>
    <rect x="264" y="312" width="268" height="376" rx="4" fill="none" stroke="#7c6b45" stroke-width="1.5" opacity="0.55"/>

    <!-- crescent emblem -->
    <path d="M410 470 a 46 46 0 1 0 4 92 a 58 58 0 0 1 -4 -92 Z" fill="#7c6b45" opacity="0.7"/>

    <!-- ribbon bookmark -->
    <path d="M 356 286 L 356 470 L 372 446 L 388 470 L 388 286 Z" fill="#8a5a4a" opacity="0.85"/>
  </g>

  <ellipse cx="400" cy="742" rx="200" ry="24" fill="#080606" opacity="0.6"/>
</svg>
