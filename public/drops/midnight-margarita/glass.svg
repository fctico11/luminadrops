<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="room" cx="55%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#241c16"/>
      <stop offset="55%" stop-color="#141010"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3835" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#8c8983" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#514e4a" stop-opacity="0.45"/>
      <stop offset="82%" stop-color="#a29d94" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#332f2c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#room)"/>

  <!-- ribbed tumbler -->
  <g>
    <path d="M270 320 L 285 800 Q 400 830 515 800 L 530 320 Q 400 300 270 320 Z" fill="url(#body)"/>
    <ellipse cx="400" cy="318" rx="130" ry="26" fill="none" stroke="#cfc8ba" stroke-width="5" opacity="0.8"/>
    <!-- liquid line -->
    <ellipse cx="400" cy="430" rx="118" ry="20" fill="#6d6355" opacity="0.5"/>
    <!-- ribs -->
    <g stroke="#d8d2c4" stroke-width="4" opacity="0.35" fill="none">
      <path d="M310 330 L 320 795"/>
      <path d="M355 325 L 361 806"/>
      <path d="M400 324 L 400 810"/>
      <path d="M445 325 L 439 806"/>
      <path d="M490 330 L 480 795"/>
    </g>
    <!-- warm rim light -->
    <path d="M282 340 L 294 780" stroke="#e8c68b" stroke-width="7" opacity="0.5" fill="none" stroke-linecap="round"/>
  </g>

  <ellipse cx="400" cy="815" rx="150" ry="24" fill="#060505"/>
  <rect x="0" y="828" width="800" height="172" fill="#070605"/>
</svg>
