<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="room" cx="42%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#2b2019"/>
      <stop offset="55%" stop-color="#171110"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffce7a" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#f2a94f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f2a94f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b7a683"/>
      <stop offset="35%" stop-color="#e8dcbc"/>
      <stop offset="70%" stop-color="#d3c49f"/>
      <stop offset="100%" stop-color="#8f7f60"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#room)"/>
  <circle cx="400" cy="300" r="320" fill="url(#glow)"/>

  <!-- cream pillar candle -->
  <g>
    <rect x="290" y="290" width="220" height="530" fill="url(#pillar)"/>
    <ellipse cx="400" cy="292" rx="110" ry="26" fill="#efe5c8"/>
    <ellipse cx="400" cy="296" rx="86" ry="18" fill="#d9cca6"/>
    <!-- drips -->
    <path d="M290 300 q 10 44 22 8 q 8 52 20 10 L 332 290 L 290 290 Z" fill="#efe5c8"/>
    <path d="M510 300 q -10 38 -22 8 q -8 44 -18 8 L 470 290 L 510 290 Z" fill="#cfc19c"/>
    <!-- wick -->
    <path d="M398 282 q 6 -26 -4 -44" stroke="#1c150e" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <ellipse cx="400" cy="830" rx="180" ry="30" fill="#080606"/>
  <rect x="0" y="840" width="800" height="160" fill="#070605"/>
</svg>
